<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; opacity: 0.35; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    .float-node { animation: float 6s ease-in-out infinite; }
    .dash-flow-1 {
      stroke-dasharray: 12, 12;
      animation: dashFlow 16s linear infinite;
    }
    .dash-flow-2 {
      stroke-dasharray: 16, 16;
      animation: dashFlowRev 22s linear infinite;
    }
    .packet {
      animation: travel 4s linear infinite;
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashFlowRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 400; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .pill-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.5;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Dynamic Tech Grid & Wave Trails (Background layer) -->
  <g opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="360" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="360" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="360" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="360" class="grid-line" />
    <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  </g>

  <!-- Dynamic Concurrent Flow Streams -->
  <g opacity="0.65">
    <path d="M-50,80 C300,160 500,-20 850,90 C1050,150 1150,50 1250,80" fill="none" stroke="url(#streamGrad1)" stroke-width="3" class="dash-flow-1" filter="url(#glow)"/>
    <path d="M-50,280 C250,200 450,340 780,240 C1020,160 1120,310 1250,260" fill="none" stroke="url(#streamGrad2)" stroke-width="3" class="dash-flow-2" filter="url(#glow)"/>
  </g>

  <!-- Glowing Connection Nodes (Background Ambient) -->
  <circle cx="1060" cy="80" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="980" cy="260" r="90" fill="#c084fc" opacity="0.08" filter="url(#glow)" />
  <circle cx="140" cy="180" r="70" fill="#818cf8" opacity="0.07" filter="url(#glow)" />

  <!-- Animated Stream Packets -->
  <circle cx="340" cy="80" r="4" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" values="100;1100;100" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="70;95;70" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="250" r="5" fill="#f472b6" filter="url(#glow)">
    <animate attributeName="cx" values="1100;100;1100" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;270;240" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground: Title, Subtitle, and Feature Tags -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <!-- Main Headline with Gradient -->
    <text y="0" class="title-text" font-size="44" fill="url(#cyanPurple)" filter="url(#glow)">
      Awesome Asynchronous HTTP Frameworks
    </text>
    
    <!-- Subtitle text -->
    <text y="48" class="subtitle-text" font-size="20">
      High-Concurrency HTTP Clients • Connection Pooling • Event-Driven Networking • Async I/O
    </text>
    <text y="82" class="subtitle-text" font-size="15" fill="#64748b">
      Curated ecosystem of elite SaaS platforms, production libraries, and high-performance protocols
    </text>
  </g>

  <!-- Feature Tags / Status Pills (Foreground) -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Python -->
    <g transform="translate(-430, 0)">
      <rect width="125" height="34" rx="17" class="pill-bg" />
      <text x="62.5" y="22" text-anchor="middle" class="pill-text">🐍 Python Async</text>
    </g>
    <!-- Pill 2: JavaScript / Node.js -->
    <g transform="translate(-290, 0)">
      <rect width="130" height="34" rx="17" class="pill-bg" />
      <text x="65" y="22" text-anchor="middle" class="pill-text">⚡ Node.js &amp; JS</text>
    </g>
    <!-- Pill 3: Rust & Go -->
    <g transform="translate(-145, 0)">
      <rect width="125" height="34" rx="17" class="pill-bg" />
      <text x="62.5" y="22" text-anchor="middle" class="pill-text">🦀 Rust &amp; Go</text>
    </g>
    <!-- Pill 4: HTTP/2 & HTTP/3 -->
    <g transform="translate(-5, 0)">
      <rect width="135" height="34" rx="17" class="pill-bg" />
      <text x="67.5" y="22" text-anchor="middle" class="pill-text">🚀 HTTP/2 &amp; HTTP/3</text>
    </g>
    <!-- Pill 5: Connection Pooling -->
    <g transform="translate(145, 0)">
      <rect width="150" height="34" rx="17" class="pill-bg" />
      <text x="75" y="22" text-anchor="middle" class="pill-text">🔄 Connection Pools</text>
    </g>
    <!-- Pill 6: Streaming & SSE -->
    <g transform="translate(310, 0)">
      <rect width="120" height="34" rx="17" class="pill-bg" />
      <text x="60" y="22" text-anchor="middle" class="pill-text">📡 SSE &amp; Streams</text>
    </g>
  </g>

  <!-- Subtle Bottom Meta Indicator -->
  <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#475569">
    ⚡ High Throughput • Low Latency • Non-Blocking I/O Benchmarks
  </text>
</svg>
